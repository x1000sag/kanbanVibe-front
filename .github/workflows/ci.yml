name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          BACKEND_SSH_DEPLOY_KEY: ${{ secrets.BACKEND_SSH_DEPLOY_KEY }}
        run: npm ci

      - name: Build
        env:
          BACKEND_SSH_DEPLOY_KEY: ${{ secrets.BACKEND_SSH_DEPLOY_KEY }}
        run: npm run build
